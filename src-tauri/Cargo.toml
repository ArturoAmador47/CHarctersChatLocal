[package]
name = "chat-characters"
version = "0.1.0"
description = "ChatCharacters — Chat with custom AI personas via LM Studio"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chat_characters_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = [] }
tauri-plugin-sql  = { version = "2", features = ["sqlite"] }
tauri-plugin-log  = "2"
tauri-plugin-shell = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
log               = "0.4"
